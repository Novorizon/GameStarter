# Include inside the existing HTTPS server {} for 15000.top. TLS continues to use port 443.
# The game TCP listener 22370 is independent of these static download locations.
location ^~ /game-updates/manifests/ {
    alias /srv/gameserver/updates/manifests/;
    autoindex off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location ^~ /game-updates/patches/ {
    alias /srv/gameserver/updates/patches/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /game-updates/assets/ {
    alias /srv/gameserver/updates/assets/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=300" always;
}
